<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="theme-color" content="#1d2417">

    <title>bob salon · Friseur in Mannheim</title>
    <meta name="description" content="bob salon ist ein Friseursalon in Mannheim unter der Leitung von Francisco Guerrero Lopera. Meisterbetrieb, Handwerkskunst, Individualität.">
    <link rel="canonical" href="https://bob.salon/">

    <!-- ==================================================================
         Die Vorschau beim Teilen eines Links (WhatsApp, iMessage, Signal,
         Facebook, LinkedIn ...).

         Ohne diese Angaben zeigen die meisten Dienste nur Titel und Domain.
         og:image muss eine vollstaendige Adresse mit https sein - ein
         relativer Pfad wird von den meisten Diensten ignoriert.

         Das Vorschaubild liegt unter public/images/vorschaubild.jpg und ist
         der Startbereich der Seite in 1200x630. Wenn das Startfoto wechselt,
         muss es neu erzeugt werden, sonst zeigt die Vorschau weiter das alte
         Bild. Wie das geht, steht in src/images/bilder.js.
         ================================================================== -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="bob salon">
    <meta property="og:locale" content="de_DE">
    <meta property="og:url" content="https://bob.salon/">
    <meta property="og:title" content="bob salon">
    <meta property="og:description" content="Friseursalon in Mannheim unter der Leitung von Francisco Guerrero Lopera. Meisterbetrieb, Handwerkskunst, Individualität.">
    <meta property="og:image" content="https://bob.salon/images/vorschaubild.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="bob – francisco guerrero lopera">

    <!-- summary_large_image sorgt fuer die grosse Bildkachel statt eines
         kleinen Vorschaubildchens am Rand. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="bob salon">
    <meta name="twitter:description" content="Friseursalon in Mannheim unter der Leitung von Francisco Guerrero Lopera. Meisterbetrieb, Handwerkskunst, Individualität.">
    <meta name="twitter:image" content="https://bob.salon/images/vorschaubild.jpg">

    <!-- Das Seitensymbol: die Wortmarke. Neuere Browser nehmen das SVG,
         aeltere und die meisten Vorschau-Dienste die .ico. -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/icon-180.png">
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json">

    <link rel="stylesheet" href="%PUBLIC_URL%/css/default.css">
    <link rel="stylesheet" href="%PUBLIC_URL%/css/layout.css">
    <link rel="stylesheet" href="%PUBLIC_URL%/css/media-queries.css">
    <link rel="stylesheet" href="%PUBLIC_URL%/css/magnific-popup.css">
  </head>

  <body>

      You need to enable JavaScript to run this app.
